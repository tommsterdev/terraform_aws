name: CD Pipeline


on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    
jobs: 
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull Docker Image
        run: docker pull tommstrdev/portfolio:0.1.8  # need to pass version as variable

      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v1

      - name: Initialize Terraform
        run: terraform init
        working-directory: aws/environments/dev

      - name: Validate Terraform Config
        run: terraform validate
        working-directory: aws/environments/dev

      - name: Plan Deployment
        run: terraform plan
        working-directory: aws/environments/dev
        env:
          TF_VAR_container_image: tommstrdev/portfolio:0.1.8
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Apply Terraform
        run: terraform apply -auto-approve
        working-directory: aws/environments/dev
        env:
          TF_VAR_container_image: tommstrdev/portfolio:0.1.8
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}


      - name: Upload Terraform state file
        uses: actions/upload-artifact@v2
        with:
          name: terraform-state
          path: ./aws/environments/dev/terraform.tfstate
          
      - name: Capture Terraform Outputs
        run: terraform output
        working-directory: aws/environments/dev

      
